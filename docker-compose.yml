services:
  db:
    image: mysql:8.4
    container_name: restaurant_saas_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-restaurant_saas}
      MYSQL_USER: ${MYSQL_USER:-restaurant_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-restaurant_password}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: restaurant_saas_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      ORANGE_API_URL: ${ORANGE_API_URL:-https://api-s1.orange.cm}
      ORANGE_USERNAME: ${ORANGE_USERNAME}
      ORANGE_PASSWORD: ${ORANGE_PASSWORD}
      ORANGE_CHANNEL_MSISDN: ${ORANGE_CHANNEL_MSISDN}
      ORANGE_PIN: ${ORANGE_PIN}
      ORANGE_X_AUTH_TOKEN: ${ORANGE_X_AUTH_TOKEN}
      ORANGE_WEBHOOK_SECRET: ${ORANGE_WEBHOOK_SECRET}
      ORANGE_WEBHOOK_ALLOWED_IPS: ${ORANGE_WEBHOOK_ALLOWED_IPS:-}
      MTN_API_URL: ${MTN_API_URL:-https://api-s1.orange.cm}
      MTN_CUSTOMER_KEY: ${MTN_CUSTOMER_KEY}
      MTN_CUSTOMER_SECRET: ${MTN_CUSTOMER_SECRET}
      MTN_CLIENT_ID: ${MTN_CLIENT_ID}
      MTN_CLIENT_SECRET: ${MTN_CLIENT_SECRET}
      MTN_CHANNEL_MSISDN: ${MTN_CHANNEL_MSISDN}
      MTN_PIN: ${MTN_PIN}
      MTN_X_AUTH_TOKEN: ${MTN_X_AUTH_TOKEN}
      MTN_WEBHOOK_SECRET: ${MTN_WEBHOOK_SECRET}
      MTN_WEBHOOK_ALLOWED_IPS: ${MTN_WEBHOOK_ALLOWED_IPS:-}
      PAYMENT_RECONCILIATION_INTERVAL_SECONDS: ${PAYMENT_RECONCILIATION_INTERVAL_SECONDS:-60}
    ports:
      - "8001:8000"
    volumes:
      - ./uploads:/app/uploads
      # Code applicatif monté en live (dev) : évite de rebuild l'image à chaque modif.
      # En prod (docker-compose.prod.yml) l'app reste bakée dans l'image.
      - ./backend/app:/app/app:ro
      # Tests montés pour pouvoir lancer `python -m unittest` dans le conteneur
      # (le Dockerfile de prod ne copie pas le dossier tests).
      - ./backend/tests:/app/tests:ro
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: restaurant_saas_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-/}
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-5177}:5173"
    depends_on:
      - backend

volumes:
  mysql_data:
