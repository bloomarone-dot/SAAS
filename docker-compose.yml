services:
  db:
    image: mysql:8.4
    container_name: restaurant_saas_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: restaurant_saas
      MYSQL_USER: restaurant_user
      MYSQL_PASSWORD: restaurant_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: restaurant_saas_backend
    restart: unless-stopped
    environment:
      MYSQL_USER: restaurant_user
      MYSQL_PASSWORD: restaurant_password
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: restaurant_saas
      SECRET_KEY: change-this-secret-in-production
      ACCESS_TOKEN_EXPIRE_MINUTES: 720
      SUPERADMIN_EMAIL: superadmin@restaurant.test
      SUPERADMIN_USERNAME: superadmin
      SUPERADMIN_PASSWORD: Superadmin123!
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: restaurant_saas_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8001
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mysql_data:
