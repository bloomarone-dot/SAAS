services:
  db:
    image: mysql:8.4
    container_name: restaurant_saas_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: restaurant_saas_backend
    restart: unless-stopped
    environment:
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-720}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      RETURN_DEV_RESET_TOKEN: "false"
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL}
      SUPERADMIN_USERNAME: ${SUPERADMIN_USERNAME}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD}
      SUPERADMIN_FIRST_NAME: ${SUPERADMIN_FIRST_NAME:-Super}
      SUPERADMIN_LAST_NAME: ${SUPERADMIN_LAST_NAME:-Admin}
      SEED_DEMO_RESTAURANT: "false"

      ORANGE_API_URL: ${ORANGE_API_URL:-https://api-s1.orange.cm}
      ORANGE_USERNAME: ${ORANGE_USERNAME}
      ORANGE_PASSWORD: ${ORANGE_PASSWORD}
      ORANGE_CHANNEL_MSISDN: ${ORANGE_CHANNEL_MSISDN}
      ORANGE_PIN: ${ORANGE_PIN}
      ORANGE_X_AUTH_TOKEN: ${ORANGE_X_AUTH_TOKEN}
      ORANGE_WEBHOOK_SECRET: ${ORANGE_WEBHOOK_SECRET}
      ORANGE_WEBHOOK_ALLOWED_IPS: ${ORANGE_WEBHOOK_ALLOWED_IPS:-}
      MTN_API_URL: ${MTN_API_URL:-https://api-s1.orange.cm}
      MTN_CUSTOMER_KEY: ${MTN_CUSTOMER_KEY}
      MTN_CUSTOMER_SECRET: ${MTN_CUSTOMER_SECRET}
      MTN_CLIENT_ID: ${MTN_CLIENT_ID}
      MTN_CLIENT_SECRET: ${MTN_CLIENT_SECRET}
      MTN_CHANNEL_MSISDN: ${MTN_CHANNEL_MSISDN}
      MTN_PIN: ${MTN_PIN}
      MTN_X_AUTH_TOKEN: ${MTN_X_AUTH_TOKEN}
      MTN_WEBHOOK_SECRET: ${MTN_WEBHOOK_SECRET}
      MTN_WEBHOOK_ALLOWED_IPS: ${MTN_WEBHOOK_ALLOWED_IPS:-}
      PAYMENT_RECONCILIATION_INTERVAL_SECONDS: ${PAYMENT_RECONCILIATION_INTERVAL_SECONDS:-60}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL}
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: restaurant_saas_frontend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
  backend_uploads:
